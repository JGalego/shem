[project]
name = "shem-neural"
version = "0.1.0"
description = "A neural vCPU for shem: an RV32IM CPU compiled into network weights"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["numpy>=2", "safetensors>=0.4", "torch>=2.5"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
