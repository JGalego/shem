[project]
name = "shem-neural"
version = "0.1.0"
description = "shem's neural side: an RV32IM CPU compiled into network weights, and model images"
readme = "README.md"
license = "MIT"
authors = [{ name = "João Galego", email = "jgalego1990@gmail.com" }]
keywords = ["shem", "containers", "riscv", "neural-network", "language-models"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Emulators",
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.4.0",
    "jinja2>=3.1.6",
    "numpy>=2",
    "safetensors>=0.4",
    "tokenizers>=0.23.3",
    "torch>=2.5",
]

[project.urls]
Homepage = "https://github.com/JGalego/shem"
Documentation = "https://github.com/JGalego/shem/tree/main/docs"
Repository = "https://github.com/JGalego/shem"

[project.scripts]
shem-neural-server = "shem_neural.server:main"
shem-neural-generate = "shem_neural.model.generate:main"
shem-neural-import = "shem_neural.model.importers:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "transformers>=5.22.2",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
