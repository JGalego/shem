  <g transform="translate(0 -40)"><text x="32" y="71" fill="#65716f" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">container mode</text>
  <text x="928" y="71" fill="#65716f" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="end">step / exit / resume</text>
  <path d="M 41 100 Q 164 97 287 99
    Q 297 99 296 109 L 295 379
    Q 296 389 286 388 Q 164 386 41 389
    Q 31 388 32 378 L 33 109 Q 32 99 41 100 Z" fill="#fbf8f2" stroke="#29343a" stroke-width="1.8" />
    <path d="M 44 102 Q 164 100 286 101 M 35 111 L 34 376" fill="none" stroke="#29343a" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round" opacity=".45"/>
  <text x="52" y="132" fill="#29343a" font-family="DejaVu Sans, sans-serif" font-size="22" text-anchor="start">RV32 program</text>
  <text x="52" y="160" fill="#65716f" font-family="DejaVu Sans Mono, monospace" font-size="18" text-anchor="start">...</text>
  <text x="52" y="191" fill="#65716f" font-family="DejaVu Sans Mono, monospace" font-size="18" text-anchor="start">addi t0, zero, 6</text>
  <text x="52" y="224" fill="#65716f" font-family="DejaVu Sans Mono, monospace" font-size="18" text-anchor="start">addi t0, t0, 1</text>
  <text x="52" y="257" fill="#65716f" font-family="DejaVu Sans Mono, monospace" font-size="18" text-anchor="start">ecall</text>
  <rect x="44" y="267" width="239" height="31" rx="4" fill="#e3efea"/><text x="52" y="290" fill="#29343a" font-family="DejaVu Sans Mono, monospace" font-size="18" text-anchor="start">addi t0, t0, 1</text>
  <text x="52" y="349" fill="#65716f" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">write args already set</text>
