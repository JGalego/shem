<svg xmlns="http://www.w3.org/2000/svg" width="960" height="411" viewBox="0 0 960 411" role="img" aria-labelledby="title description">
  <title id="title">How shem runs a guest</title>
  <desc id="description">A program executes on the compiled RV32IM vCPU, one instruction per forward pass, updating register and memory state. ecall stops execution without retiring. The host writes hi to stdout, sets a0 to 3, advances the pc by four bytes, and resumes the guest.</desc>
