repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Fuzz seeds, as fuzz_seeds.rs writes them
        exclude: ^fuzz/seeds/
      - id: end-of-file-fixer
        # A saved session's model, as test_sessions.py writes it, and fuzz seeds
        exclude: ^(neural/tests/sessions|fuzz/seeds)/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      # Model weights and state snapshots belong in a registry, not in git.
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]
      # Dockerfiles and Shemfiles, in hadolint's image, through a wrapper that
      # turns shem's own instructions into comments. hadolint can't parse a
      # base with both a registry port and a tag, as the ModelPack example's
      - id: hadolint
        name: hadolint
        entry: --entrypoint /bin/sh hadolint/hadolint:v2.14.0-alpine scripts/hadolint
        language: docker_image
        files: (^|/)(Dockerfile|Shemfile)$
        exclude: ^examples/modelpack/Shemfile$
