# cargo deny check: licences, security advisories, duplicate and banned
# crates, and where crates come from. CI runs it on every push.

[graph]
all-features = true

[advisories]
# Fail on any vulnerability or unsound crate. Unmaintained crates fail only
# when shem depends on them directly: the ones the containerd shim's own
# dependencies bring in (zbus, pin-utils) are for upstream to replace.
unmaintained = "workspace"
ignore = []

[licenses]
# Permissive licences only, so shem can stay Apache-2.0
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
