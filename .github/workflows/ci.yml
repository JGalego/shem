name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Run pre-commit hooks
        run: uvx pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  guest-tests:
    name: Guest tests (riscv-tests, C, BusyBox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - name: Build guests in Docker and run them
        run: just guest-tests

  neural:
    name: Neural vCPU (against the reference)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: neural/uv.lock
      - uses: extractions/setup-just@v4
      - name: Unit tests, then riscv-tests, random programs, VM mode and Linux on both vCPUs
        run: just neural-tests

  vm:
    name: VM mode (boots Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - name: Boot a no-MMU Linux to a shell and power it off
        run: just vm-tests

  containerd:
    name: containerd shim (ctr run, docker run)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - name: Run an RV32 container through containerd on shem
        run: just containerd-test
      - name: Build it with docker build and run it with docker run on shem
        run: just docker-test

  package:
    name: Package (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Package and verify the crates, as a release would
        run: cargo publish --workspace --dry-run --locked
      - name: Build the Python package
        run: uv build --project neural

  models:
    name: Model images (against transformers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: neural/uv.lock
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: huggingface-qwen3-0.6b-qwen3.5-0.8b
      - name: Import Qwen3 and Qwen3.5, compare them with transformers, and resume saved sessions
        run: uv run --project neural pytest -q neural/tests/test_model.py
        env:
          SHEM_MODEL_TESTS: "1"

  registry:
    name: Registry (push and pull)
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oras-project/setup-oras@v2.0.3
      - name: Push a warm image to a registry and pull it back
        env:
          SHEM_TEST_REGISTRY: localhost:5000
        run: cargo test --release --test image registry -- --ignored
