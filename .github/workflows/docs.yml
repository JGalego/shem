name: Docs

# The website on GitHub Pages: the landing page in site/ and install.sh at the
# root, and docs/ built with mdBook under /docs/. Every run builds the site;
# it deploys once Pages is on and the repository variable DOCS_SITE is true.
on:
  push:
    branches: [main]
    paths: ["docs/**", "site/**", "install.sh", "book.toml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest
      - name: Point links to source files at GitHub, then build
        run: |
          # Links that leave docs/ (../crates/..., ../examples/...) work on GitHub, not on the site
          sed -i -E 's#\]\(\.\./([^)]*)\)#](https://github.com/JGalego/shem/blob/main/\1)#g' docs/*.md
          mdbook build -d _site/docs
          cp -r site/. install.sh _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: vars.DOCS_SITE == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
