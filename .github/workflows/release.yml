name: Release

# Pushing a tag vX.Y.Z publishes that version everywhere:
#   - the shem and containerd-shim-shem crates on crates.io
#   - the shem-neural package on PyPI
#   - shem and containerd-shim-shem-v1 binaries, with build provenance, on the GitHub release
#   - the guest toolchain, the shem-neural runtime and the docker build frontend images on GHCR, for amd64 and arm64
#   - the examples as shem images on GHCR: programs, a warm shell, a booted Linux, and models
#   - the compiled CPU's weights, with a model card, on the Hugging Face Hub
#   - release notes from the conventional commits since the last tag
# Running it by hand builds and checks everything, and publishes nothing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Versions and packages
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.3.3
      - id: version
        name: Check that the tag, the crates and the Python package agree
        run: |
          crates=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "shem") | .version')
          python=$(uv version --project neural --short)
          echo "crates $crates, shem-neural $python, ref $GITHUB_REF_NAME"
          [ "$crates" = "$python" ] || { echo "the crates and shem-neural have different versions"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$crates" ]; then
            echo "the tag $GITHUB_REF_NAME is not v$crates"; exit 1
          fi
          echo "version=$crates" >> "$GITHUB_OUTPUT"
      - name: Package and verify the crates
        run: cargo publish --workspace --dry-run --locked
      - name: Build the Python package
        run: uv build --project neural --out-dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: python
          path: dist

  binaries:
    name: Binaries (${{ matrix.target }})
    needs: verify
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, packages: -p shem -p containerd-shim-shem }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, packages: -p shem -p containerd-shim-shem }
          - { os: macos-latest, target: aarch64-apple-darwin, packages: -p shem }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked ${{ matrix.packages }}
      - name: Package
        run: |
          name="shem-${{ needs.verify.outputs.version }}-${{ matrix.target }}"
          mkdir "$name"
          cp target/release/shem LICENSE README.md "$name/"
          if [ -f target/release/containerd-shim-shem-v1 ]; then cp target/release/containerd-shim-shem-v1 "$name/"; fi
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/attest-build-provenance@v4
        if: github.ref_type == 'tag'
        with:
          subject-path: shem-*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: shem-*.tar.gz*

  images:
    name: Image (${{ matrix.image }})
    needs: verify
    strategy:
      matrix:
        include:
          - { image: shem-toolchain, context: toolchain, target: toolchain }
          - { image: shem-neural, context: neural, target: "" }
          - { image: shem/dockerfile, context: frontend, target: "" }
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.verify.outputs.version }}
          sbom: true
          provenance: mode=max
          push: ${{ github.ref_type == 'tag' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.verify.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
      - uses: actions/attest-build-provenance@v4
        if: github.ref_type == 'tag'
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  examples:
    name: Example images
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: oras-project/setup-oras@v2.0.3
      - uses: docker/login-action@v4
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build shem and the images the examples copy from
        run: |
          cargo build --release --locked -p shem
          docker build -q --target toolchain -t shem-toolchain toolchain
          docker build -q --target busybox -t shem-busybox toolchain
      - name: Build the examples, and push them on a release
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          PUSH: ${{ github.ref_type == 'tag' }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shem"
          for example in hello warm-shell linux qwen3 qwen3.5 golem; do
            target/release/shem build -t "$example" "examples/$example"
            if [ "$PUSH" = true ]; then
              target/release/shem push "$example" "$repo/$example:$VERSION"
              target/release/shem push "$example" "$repo/$example:latest"
            fi
            # Models are big: drop each one's download and image once it is out
            rm -rf ~/.cache/huggingface ~/.local/share/shem/images/"$example"
          done

  crates:
    name: Publish to crates.io
    needs: [verify, binaries]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      # A token for the first release; afterwards, trusted publishing
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: env.CARGO_REGISTRY_TOKEN == ''
      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}

  pypi:
    name: Publish to PyPI
    needs: [verify, binaries]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/download-artifact@v8
        with:
          name: python
          path: dist
      - name: Publish with trusted publishing
        run: uv publish dist/*

  weights:
    name: Compiled weights on Hugging Face
    needs: [verify, crates, pypi]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: huggingface
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Export, upload and tag the weights
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ vars.HF_REPO || 'JGalego/shem-rv32im' }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          uv run --project neural python -m shem_neural.export weights --version "$VERSION"
          uvx --from huggingface_hub hf upload "$HF_REPO" weights . --commit-message "shem $VERSION"
          uvx --from huggingface_hub hf repos tag create "$HF_REPO" "v$VERSION"

  release:
    name: GitHub release
    needs: [verify, binaries, images, examples, crates, pypi, weights]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest
        env:
          OUTPUT: NOTES.md
      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "shem $GITHUB_REF_NAME" --notes-file NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
