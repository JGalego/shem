[package]
name = "shem"
version.workspace = true
authors.workspace = true
description = "Run containers and VMs inside a model's weights"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

# cargo binstall downloads the release's binaries instead of compiling
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/shem-{ version }-{ target }.tar.gz"
bin-dir = "shem-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1.1.11"
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3"
thiserror = "2"
zstd = "0.14.3"
