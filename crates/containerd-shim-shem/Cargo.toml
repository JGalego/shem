[package]
name = "containerd-shim-shem"
version.workspace = true
authors.workspace = true
description = "A containerd shim that runs containers on shem"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "containerd-shim-shem-v1"
path = "src/main.rs"

# cargo binstall downloads the release's binaries instead of compiling
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/shem-{ version }-{ target }.tar.gz"
bin-dir = "shem-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
anyhow = "1"
libc = "0.2"
log = "0.4"
serde_json = "1"
shem.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
containerd-shim = "0.12"

[dev-dependencies]
tempfile = "3"
