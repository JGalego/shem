[package]
name = "containerd-shim-shem"
version.workspace = true
authors.workspace = true
description = "A containerd shim that runs containers on shem"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "containerd-shim-shem-v1"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde_json = "1"
shem.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
containerd-shim = "0.12"
libc = "0.2"
log = "0.4"

[dev-dependencies]
tempfile = "3"
