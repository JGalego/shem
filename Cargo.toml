[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
authors = ["João Galego <jgalego1990@gmail.com>"]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/JGalego/shem"
homepage = "https://github.com/JGalego/shem"
readme = "README.md"
keywords = ["containers", "oci", "riscv", "neural-network", "virtualization"]
categories = ["virtualization", "emulators", "command-line-utilities"]

[workspace.dependencies]
shem = { path = "crates/shem", version = "0.2.0" }
